<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaHub - Contact</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite -->
    <link
        href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-gray-100">


    <!-- NAVBAR -->

    <nav class="bg-slate-900">

        <div class="max-w-screen-xl mx-auto px-4 py-4
                    flex justify-between items-center">

            <a href="index.html"
               class="text-2xl font-bold text-white">
                Nova<span class="text-blue-500">Hub</span>
            </a>

            <div class="flex gap-5 items-center">

                <a href="index.html"
                   class="text-gray-300 hover:text-white">
                    Home
                </a>

                <a href="about.html"
                   class="text-gray-300 hover:text-white">
                    About
                </a>

                <a href="contact.html"
                   class="text-blue-400">
                    Contact
                </a>

                <a href="SignUp.html"
                   class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                    Sign Up
                </a>

                <a href="SignIn.html"
                   class="text-blue-400">
                    Sign In
                </a>

            </div>

        </div>

    </nav>


    <!-- CONTACT HEADING -->

    <section class="bg-slate-950 py-10 text-center">

    <h1 class="text-3xl font-bold text-white">
        Contact Us
    </h1>

    <p class="text-gray-400 mt-2 text-sm">
        Have a question? Send us a message.
    </p>

</section>


    <!-- CONTACT SECTION -->

    <section class="max-w-screen-md mx-auto px-4 py-12">


        <!-- Contact Info Card -->

        <div class="bg-white rounded-xl shadow p-6 mb-6">

            <h2 class="text-xl font-bold text-gray-900 mb-3">
                Get in Touch
            </h2>

            <p class="text-gray-600">
                Email: support@novahub.com
            </p>

            <p class="text-gray-600 mt-2">
                Phone: +92 300 1234567
            </p>

        </div>


        <!-- Contact Form -->

        <div class="bg-white rounded-xl shadow p-6">

            <h2 class="text-xl font-bold text-gray-900 mb-6">
                Send a Message
            </h2>


            <form
                action="https://formspree.io/f/YOUR_FORM_ID"
                method="POST"
                class="space-y-5"
            >


                <!-- Name -->

                <div>

                    <label
                        for="name"
                        class="block mb-2 font-medium text-gray-900">

                        Name

                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        minlength="3"
                        placeholder="Your name"
                        class="w-full p-3 border border-gray-300
                               rounded-lg focus:ring-2
                               focus:ring-blue-500"
                    >

                </div>


                <!-- Email -->

                <div>

                    <label
                        for="email"
                        class="block mb-2 font-medium text-gray-900">

                        Email

                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="you@example.com"
                        class="w-full p-3 border border-gray-300
                               rounded-lg focus:ring-2
                               focus:ring-blue-500"
                    >

                </div>


                <!-- Message -->

                <div>

                    <label
                        for="message"
                        class="block mb-2 font-medium text-gray-900">

                        Message

                    </label>

                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                        minlength="10"
                        placeholder="Write your message..."
                        class="w-full p-3 border border-gray-300
                               rounded-lg focus:ring-2
                               focus:ring-blue-500"
                    ></textarea>

                </div>


                <!-- Button -->

                <button
                    type="submit"
                    class="w-full bg-blue-600
                           hover:bg-blue-700
                           text-white font-semibold
                           py-3 rounded-lg">

                    Send Message

                </button>

            </form>

        </div>


        <!-- Flowbite Accordion -->

        <div class="mt-6">

            <div id="accordion-contact"
                 data-accordion="collapse">

                <h2 id="accordion-heading">

                    <button
                        type="button"
                        class="flex items-center justify-between
                               w-full p-5 font-medium
                               text-gray-700 bg-white
                               border border-gray-200 rounded-lg"
                        data-accordion-target="#accordion-body"
                        aria-expanded="false"
                        aria-controls="accordion-body">

                        <span>How can I contact NovaHub?</span>

                        <span>+</span>

                    </button>

                </h2>


                <div id="accordion-body"
                     class="hidden"
                     aria-labelledby="accordion-heading">

                    <div class="p-5 bg-white border border-gray-200">

                        <p class="text-gray-600">
                            You can contact us using the form above
                            or through our email address.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer class="bg-black text-white text-center py-6">

        <p class="text-gray-500">
            © 2026 NovaHub. All rights reserved.
        </p>

    </footer>


    <!-- Flowbite JS -->

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js">
    </script>

</body>

</html>
