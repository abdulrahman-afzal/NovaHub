<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NovaHub - Sign Up</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Flowbite -->
    <link
        href="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-gray-100">


    <!-- NAVBAR -->

    <nav class="bg-slate-900">

        <div class="max-w-screen-xl mx-auto px-4 py-4
                    flex justify-between items-center">

            <a href="index.html"
               class="text-2xl font-bold text-white">
                Nova<span class="text-blue-500">Hub</span>
            </a>

            <div class="flex gap-5 items-center">

                <a href="index.html"
                   class="text-gray-300 hover:text-white">
                    Home
                </a>

                <a href="about.html"
                   class="text-gray-300 hover:text-white">
                    About
                </a>

                <a href="contact.html"
                   class="text-gray-300 hover:text-white">
                    Contact
                </a>

                <a href="signup.html"
                   class="bg-blue-600 text-white px-4 py-2 rounded-lg">
                    Sign Up
                </a>

                <a href="signin.html"
                   class="text-blue-400">
                    Sign In
                </a>

            </div>

        </div>

    </nav>


    <!-- SIGN UP -->

    <main class="min-h-screen flex items-center justify-center px-4 py-10">

        <div class="w-full max-w-md">


            <!-- Heading -->

            <div class="text-center mb-6">

                <h1 class="text-3xl font-bold text-gray-900">
                    Create Account
                </h1>

                <p class="text-gray-500 mt-2">
                    Join NovaHub today
                </p>

            </div>


            <!-- Form Card -->

            <div class="bg-white rounded-xl shadow p-6">


                <form class="space-y-4">


                    <!-- Name -->

                    <div>

                        <label
                            for="name"
                            class="block mb-2 text-sm font-medium
                                   text-gray-900">

                            Full Name

                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                            minlength="3"
                            placeholder="Your name"
                            class="w-full p-3 border
                                   border-gray-300 rounded-lg
                                   focus:ring-2
                                   focus:ring-blue-500"
                        >

                    </div>


                    <!-- Email -->

                    <div>

                        <label
                            for="email"
                            class="block mb-2 text-sm font-medium
                                   text-gray-900">

                            Email

                        </label>

                        <input
                            type="email"
                            id="email"
                            required
                            placeholder="you@example.com"
                            class="w-full p-3 border
                                   border-gray-300 rounded-lg
                                   focus:ring-2
                                   focus:ring-blue-500"
                        >

                    </div>


                    <!-- Password -->

                    <div>

                        <label
                            for="password"
                            class="block mb-2 text-sm font-medium
                                   text-gray-900">

                            Password

                        </label>

                        <input
                            type="password"
                            id="password"
                            required
                            minlength="6"
                            placeholder="••••••••"
                            class="w-full p-3 border
                                   border-gray-300 rounded-lg
                                   focus:ring-2
                                   focus:ring-blue-500"
                        >

                    </div>


                    <!-- Terms -->

                    <div class="flex items-center gap-2">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                            class="w-4 h-4 text-blue-600"
                        >

                        <label
                            for="terms"
                            class="text-sm text-gray-600">

                            I agree to the terms and conditions.

                        </label>

                    </div>


                    <!-- Button -->

                    <button
                        type="submit"
                        class="w-full bg-blue-600
                               hover:bg-blue-700
                               text-white font-semibold
                               py-3 rounded-lg">

                        Create Account

                    </button>


                </form>


                <!-- Sign In Link -->

                <p class="text-center text-sm text-gray-500 mt-5">

                    Already have an account?

                    <a href="signin.html"
                       class="text-blue-600 font-semibold
                              hover:underline">

                        Sign in.

                    </a>

                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-black text-white text-center py-5">

        <p class="text-gray-500 text-sm">
            © 2026 NovaHub. All rights reserved.
        </p>

    </footer>


    <!-- Flowbite JS -->

    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.1/dist/flowbite.min.js">
    </script>

</body>

</html>
